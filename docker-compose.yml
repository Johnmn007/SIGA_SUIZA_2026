  # ====== FRONTEND ======
  siga-frontend:
    build:
      context: ./siga_frontend
      dockerfile: Dockerfile
      target: build
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 80"]
    ports:
      - "3000:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./siga_frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - siga-net
    restart: unless-stopped
    depends_on:
      - siga-core

volumes:
  # Conservado como respaldo histórico (datos previos en Docker). Ya no se usa.
  postgres_data:
  frontend_node_modules:

networks:
  siga-net:
    driver: bridge
