services:
  # ====== BASE DE DATOS ======
  # PostgreSQL vive dentro de Docker. La primera vez que se crea el volumen,
  # se restaura automaticamente el dump indicado en DB_INIT_DUMP.
  # Para volver a restaurar desde cero: docker compose down -v
  postgres:
    image: postgres:18-alpine
    container_name: siga-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-siga_core}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432.
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      # En la imagen postgres:18 el PGDATA vive en /var/lib/postgresql/18/docker.
      # Se usa un volumen nuevo (v18) para no tocar datos de versiones previas.
      - postgres_data_v18:/var/lib/postgresql
      - ./${DB_INIT_DUMP:-backup_siga_core_pre_reset_20261102.sql}:/docker-entrypoint-initdb.d/01-siga.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-siga_core}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== CORE GATEWAY ======
  siga-core:
    build:
      context: ./siga_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${DB_USER:-postgres}
