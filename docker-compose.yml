services:
  # Base de datos: La aplicacion utiliza PostgreSQL local en el host (puerto 5432)
  # accesible desde los contenedores via host.docker.internal:5432 con usuario postgres y credenciales de .env.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: "admin123"
  #     POSTGRES_DB: siga_core
  #   ports:
  #     - "5433:5432"

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== CORE GATEWAY ======
  siga-core:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-john.007}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-siga_core}
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./siga_backend:/app
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy

  # ====== MICROSERVICES ======
  mod-usuarios:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-usuarios && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"]
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-john.007}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-siga_core}
      - NATS_URL=nats://nats:4222
      - PORT=8001
      - SKIP_MIGRATIONS=true
    volumes:
      - ./siga_backend:/app

