# NOTA: la base de datos NO corre en Docker. Vive en el PostgreSQL nativo
# de Windows (visible en pgAdmin, BD siga_core, localhost:5432).
# Los servicios la alcanzan vía host.docker.internal.
services:
  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    networks:
      - siga-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - siga-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== CORE GATEWAY ======
  siga-core:
    build:
      context: ./siga_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=12345
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./siga_backend:/app
    networks:
      - siga-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy

  # ====== MICROSERVICES ======
  mod-usuarios:
    build:
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-usuarios && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"]
    ports:
      - "8001:8001"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=12345
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8001
      - SKIP_MIGRATIONS=true
    volumes:
      - ./siga_backend:/app
    networks:
      - siga-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

