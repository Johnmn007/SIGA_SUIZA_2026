services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "john.007"
      POSTGRES_DB: siga_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siga_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
    command: ["-js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== CORE GATEWAY ======
  siga-core:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy

  # ====== MICROSERVICES ======
  mod-usuarios:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-usuarios && uvicorn main:app --host 0.0.0.0 --port 8001"]
    ports:
      - "8001:8001"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8001
    depends_on:
      postgres:
        condition: service_healthy

  mod-planes-estudio:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-planes-estudio && uvicorn main:app --host 0.0.0.0 --port 8002"]
    ports:
      - "8002:8002"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8002
    depends_on:
      postgres:
        condition: service_healthy

  mod-programas-estudio:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-programas-estudio && uvicorn main:app --host 0.0.0.0 --port 8005"]
    ports:
      - "8005:8005"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8005
    depends_on:
      postgres:
        condition: service_healthy

  mod-gestion-academica:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-gestion-academica && uvicorn main:app --host 0.0.0.0 --port 8006"]
    ports:
      - "8006:8006"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8006
    depends_on:
      postgres:
        condition: service_healthy

  mod-auditoria:
    build: 
      context: ./siga_backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd modules/mod-auditoria && uvicorn main:app --host 0.0.0.0 --port 8007"]
    ports:
      - "8007:8007"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=john.007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siga_core
      - NATS_URL=nats://nats:4222
      - PORT=8007
    depends_on:
      postgres:
        condition: service_healthy

  # ====== FRONTEND ======
  siga-frontend:
    build: 
      context: ./siga_frontend
      dockerfile: Dockerfile
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "3000:80"
    volumes:
      - ./siga_frontend:/app
      - /app/node_modules
    depends_on:
      - siga-core

volumes:
  postgres_data:
