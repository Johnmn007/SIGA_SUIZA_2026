[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# SQLAlchemy URL - Usar variables de entorno (DATABASE_URL desde Railway)
# Valor por defecto solo para desarrollos locales sin DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://postgres:cambiar-esta-clave@localhost:5432/siga_suiza_2026

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S