[pytest]
testpaths = tests modules/mod-gestion-academica
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
norecursedirs = tools modules/mod-programas-estudio modules/mod-usuarios modules/mod-evaluacion modules/mod-admision modules/mod-auditoria modules/mod-planes-estudio
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
