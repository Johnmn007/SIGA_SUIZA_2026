name: "mod-usuarios"
version: "1.0.0"
api_version: "v1"
description: "Módulo de gestión de usuarios, roles y perfiles (RBAC)"
author: "SIGA Core Team"

endpoints:
  http: "http://localhost:8005"
  ws: "ws://localhost:8005/ws"

health_check: "/health"

dependencies: []

permissions:
  - "usuarios:read"
  - "usuarios:write"
  - "roles:read"
  - "roles:write"

events:
  publishes:
    - "usuario.creado"
    - "usuario.actualizado"
    - "usuario.eliminado"
    - "rol.asignado"
  subscribes: []